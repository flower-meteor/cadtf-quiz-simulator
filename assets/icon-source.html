<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      color: #fff;
      background: #17365d;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    .mark {
      text-align: center;
    }

    .mark svg {
      width: 56%;
      min-width: 110px;
      max-width: 300px;
      height: auto;
      stroke-width: 1.7;
    }

    .mark span {
      display: block;
      margin-top: 18px;
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 0;
    }
  </style>
</head>
<body>
  <div class="mark">
    <i data-lucide="clipboard-check"></i>
    <span>问答模拟</span>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
